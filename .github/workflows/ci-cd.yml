# GitHub Actions Workflow para Deploy Automático

# Este arquivo é opcional - Vercel e Railway já fazem deploy automático

# Mas você pode usar para testes e validações

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend-web/package-lock.json
          backend/package-lock.json
    
    - name: Install Frontend Dependencies
      working-directory: ./frontend-web
      run: npm ci
    
    - name: Lint Frontend
      working-directory: ./frontend-web
      run: npm run lint
      continue-on-error: true
    
    - name: Build Frontend
      working-directory: ./frontend-web
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
    
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Test Backend
      working-directory: ./backend
      run: npm test
      continue-on-error: true

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Success
      if: success()
      run: echo "✅ Build successful!"
    
    - name: Notify Failure
      if: failure()
      run: echo "❌ Build failed!"

